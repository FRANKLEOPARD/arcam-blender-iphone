name: ARCamStream
options:
  bundleIdPrefix: com.arcam
  deploymentTarget:
    iOS: "16.0"
targets:
  ARCamStream:
    type: application
    platform: iOS
    sources:
      - ARCamStream
    info:
      # Generated by XcodeGen at build time. Kept OUTSIDE the source folder so it is never
      # also copied as a resource ("Multiple commands produce Info.plist").
      path: Info.plist
      properties:
        CFBundleDisplayName: ARCam
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        NSCameraUsageDescription: "ARKit needs the camera to track the phone position."
        NSLocalNetworkUsageDescription: "Sends the camera position to Blender on your computer."
        UIRequiredDeviceCapabilities:
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arcam.stream
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
