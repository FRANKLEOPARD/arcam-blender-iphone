name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  python-checks:
    name: Python syntax + network tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile blender/arcam_blender_addon.py tools/fake_phone.py
      - name: Listener / protocol tests (bpy and mathutils are stubbed)
        run: python tests/test_listener.py

  ios-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned, Release, device SDK)
        working-directory: ios
        run: |
          xcodebuild -project ARCamStream.xcodeproj -scheme ARCamStream \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        working-directory: ios
        run: |
          rm -rf Payload ARCamStream.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ARCamStream.app Payload/
          zip -qr ARCamStream.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ARCamStream-ipa
          path: ios/ARCamStream.ipa

  release:
    name: Attach files to GitHub Release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-checks, ios-ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ARCamStream-ipa
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ARCamStream.ipa
            blender/arcam_blender_addon.py
