name: Build

# Action versions use the Node 24 runtime (GitHub removed Node 20 from Actions in Sept 2026).

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  python-checks:
    name: Python syntax + add-on tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependency (numpy powers the stand-in for Blender's mathutils)
        run: python -m pip install numpy
      - name: Syntax check
        run: python -m py_compile blender/arcam_blender_addon.py tools/fake_phone.py tests/test_listener.py tests/fake_mathutils.py
      - name: Add-on tests (bpy is stubbed, mathutils is a numpy stand-in)
        run: python tests/test_listener.py

  ios-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version (useful when reading a failed log)
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned, Release, device SDK)
        working-directory: ios
        run: |
          xcodebuild -project ARCamStream.xcodeproj -scheme ARCamStream \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        working-directory: ios
        run: |
          set -e
          rm -rf Payload ARCamStream.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ARCamStream.app Payload/
          zip -qry ARCamStream.ipa Payload
          ls -lh ARCamStream.ipa
      - uses: actions/upload-artifact@v6
        with:
          name: ARCamStream-ipa
          path: ios/ARCamStream.ipa
          if-no-files-found: error

  release:
    name: Attach files to GitHub Release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-checks, ios-ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: ARCamStream-ipa
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/ARCamStream.ipa
            blender/arcam_blender_addon.py
